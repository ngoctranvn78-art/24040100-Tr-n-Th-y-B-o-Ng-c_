<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Introduction</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #26364a; background: #f3f6fa; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 32px 16px; display: grid; place-items: center; }
    main { width: min(100%, 640px); padding: 36px; background: #fff; border: 1px solid #e3eaf2; border-radius: 16px; box-shadow: 0 12px 30px rgba(38, 54, 74, .08); }
    h1 { margin: 0 0 24px; color: #285b8e; font-size: 2rem; }
    section { padding: 17px 0; border-top: 1px solid #edf1f5; }
    h2 { margin: 0 0 8px; font-size: 1rem; font-weight: 600; }
    p { margin: 0; line-height: 1.6; }
    @media (max-width: 480px) { main { padding: 26px 22px; } h1 { font-size: 1.7rem; } }
  </style>
</head>
<body>
  <main>
    <h1>Introduction</h1>
    <section><h2>Full Name</h2><p>Nguyễn Thị Dịu Hiền</p></section>
    <section><h2>Major</h2><p>Quan hệ c&#244;ng ch&#250;ng</p></section>
    <section><h2>Skills</h2><p>N&#243;i năng lưu lo&#225;t</p></section>
    <section><h2>Career Goals</h2><p>Ổn định</p></section>
  </main>
</body>
</html>
